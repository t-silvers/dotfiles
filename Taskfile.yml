version: '3'

set: [errexit, nounset, pipefail]

vars:
  DEV_REPO_DIR: '{{.TASKFILE_DIR}}'
  SCRIPTS_DIR: '{{joinPath .TASKFILE_DIR ".github/scripts"}}'
  YAMLLINT_CONFIG: '{{joinPath .TASKFILE_DIR ".github/linters/.yamllint"}}'
  RELEASE_BRANCH: main
  FLAGS: ''
  DEFAULT_SOURCE_DIR: '{{joinPath .HOME ".local/share/chezmoi/home"}}'
  DOTFILES_SNAPSHOT_DIR: >-
    {{.XDG_CACHE_HOME | default (joinPath .HOME ".cache")}}/snapshots/dotfiles

tasks:
  # -- Daily operations

  chezmoi:assert-clean:
    internal: true
    silent: true
    vars:
      CHEZMOI_SOURCE_DIR:
        sh: SMOKE=1 chezmoi source-path || true
      LOCAL_REPO_DIR: >-
        {{(.CHEZMOI_SOURCE_DIR | default .DEFAULT_SOURCE_DIR) | dir}}
    cmds:
      - |
          repo={{.LOCAL_REPO_DIR | shellQuote}}
          if ! status="$(git -C "$repo" status --porcelain 2>/dev/null)" \
          || [ -n "$status" ]; then
          printf '%s %s\n' \
          "Chezmoi checkout ($repo) is missing, not a git repo, or has" \
          "uncommitted/untracked changes. Reconcile or reset it first." >&2
          exit 1
          fi

  update:
    desc: Update machine dotfiles from remote (requires clean chezmoi checkout)
    interactive: true
    cmds:
      - task: chezmoi:assert-clean
      - chezmoi update --init

  update-i:
    desc: Interactive chezmoi update
    interactive: true
    cmds:
      - task: chezmoi:assert-clean
      - chezmoi git pull -- --ff-only
      - chezmoi diff
      - task: apply-update

  apply-update:
    internal: true
    interactive: true
    prompt: Apply changes from remote?
    cmds:
      - chezmoi apply --init

  diff:
    desc: Preview development dotfiles changes without updating sources
    interactive: true
    cmds:
      - >-
          SMOKE=1 chezmoi --source {{.DEV_REPO_DIR | shellQuote}}
          --refresh-externals=never diff

  dry-run:
    desc: Dry-run apply from development checkout without modifying HOME
    cmds:
      - >-
          SMOKE=1 chezmoi --source {{.DEV_REPO_DIR | shellQuote}}
          --refresh-externals=never apply --dry-run --verbose --force

  # -- Testing & linting

  render-file:
    aliases: [render]
    desc: Render dotfile template file to stdout
    summary: |
      Render dotfile template file to stdout

      Rendering uses templates and data in the development checkout
      (DEV_REPO_DIR), with FILE or -- <path> selecting the template.
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      TARGET_FILE: >-
        {{- if .FILE -}}{{.FILE}}
        {{- else if .CLI_ARGS_LIST -}}{{index .CLI_ARGS_LIST 0}}
        {{- end -}}
      QUOTED_FLAGS: >-
        {{- range (.FLAGS | splitArgs)}} {{. | shellQuote}}{{end -}}
    cmds:
      - |
          target={{.TARGET_FILE | shellQuote}}
          if [ -z "$target" ]; then
          echo "FILE is required (pass FILE=<path> or -- <path>)." >&2
          exit 1
          fi
          if [ ! -f "$target" ]; then
          printf 'File %s not found.\n' "$target" >&2
          exit 1
          fi
          SMOKE=1 chezmoi --source {{.DEV_REPO_DIR | shellQuote}} \
          --refresh-externals=never execute-template{{.QUOTED_FLAGS}} \
          --file -- "$target"

  lint:
    desc: Lint YAML, GitHub Actions workflows, and shell scripts/templates
    cmds:
      - test -d {{.DEV_REPO_DIR | shellQuote}}
      - >-
          yamllint -s -c {{.YAMLLINT_CONFIG | shellQuote}}
          {{.DEV_REPO_DIR | shellQuote}}
      - cd {{.DEV_REPO_DIR | shellQuote}} && jactionlint
      - >-
          {{.SCRIPTS_DIR | shellQuote}}/lint-shell.sh
          {{.DEV_REPO_DIR | shellQuote}}

  test:
    desc: Check dotfiles behavior using disposable files and command stubs
    cmds:
      - >-
          cd {{.DEV_REPO_DIR | shellQuote}}
          && bats --print-output-on-failure
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}tests/unit/*.bats{{end}}

  test:ci:
    aliases: [check]
    desc: Run lint, chezmoi dry-run, and the unit test suite
    cmds:
      - task: lint
      - task: dry-run
      - task: test
        vars:
          CLI_ARGS: ''

  ci:watch:
    desc: Await GitHub Actions CI for HEAD and print failed logs on failure
    interactive: true
    cmds:
      - >-
          cd {{.DEV_REPO_DIR | shellQuote}}
          && {{.SCRIPTS_DIR | shellQuote}}/watch-ci.sh {{.CLI_ARGS}}

  # -- Releases

  release:
    desc: >-
      Bump version (PART=minor), check, commit, and publish after CI passes
    vars:
      PART: '{{.PART | default "minor"}}'
    requires:
      vars:
        - name: PART
          enum: [major, minor, patch]
    cmds:
      - >-
          {{.SCRIPTS_DIR | shellQuote}}/release-guard.sh prepare
          {{.DEV_REPO_DIR | shellQuote}} {{.RELEASE_BRANCH | shellQuote}}
          {{.PART | shellQuote}}
      - task: release:confirm
        vars:
          PART: '{{.PART}}'
          CLI_ARGS: '{{.CLI_ARGS}}'

  release:confirm:
    internal: true
    prompt: Publish next ({{.PART}}) versioned release?
    requires:
      vars:
        - name: PART
          enum: [major, minor, patch]
    cmds:
      - task: test:ci
        vars:
          CLI_ARGS: ''
      - task: release:bump
        vars:
          PART: '{{.PART}}'
      - task: release:commit
      - task: release:publish
        vars:
          CLI_ARGS: '{{.CLI_ARGS}}'

  release:bump:
    internal: true
    requires:
      vars:
        - name: PART
          enum: [major, minor, patch]
    cmds:
      - >-
          {{.SCRIPTS_DIR | shellQuote}}/bump-version.sh
          {{.PART | shellQuote}}
          {{joinPath .DEV_REPO_DIR "VERSION" | shellQuote}}

  release:commit:
    internal: true
    cmds:
      - |
          repo={{.DEV_REPO_DIR | shellQuote}}
          ver="$({{.SCRIPTS_DIR | shellQuote}}/bump-version.sh \
          --read --nonzero "$repo/VERSION")"
          git -C "$repo" add -A
          git -C "$repo" commit -m "Release v$ver"

  release:publish:
    desc: >-
      Push main, await CI, tag, and publish Release
      (retry here after fixing CI)
    cmds:
      - >-
          {{.SCRIPTS_DIR | shellQuote}}/release-guard.sh publish
          {{.DEV_REPO_DIR | shellQuote}} {{.RELEASE_BRANCH | shellQuote}}
      - >-
          git -C {{.DEV_REPO_DIR | shellQuote}} push origin
          {{.RELEASE_BRANCH | shellQuote}}
      - task: ci:watch
        vars:
          CLI_ARGS: ''
      - |
          repo={{.DEV_REPO_DIR | shellQuote}}
          ver="$({{.SCRIPTS_DIR | shellQuote}}/bump-version.sh \
          --read --nonzero "$repo/VERSION")"
          tag="v$ver"
          if ! git -C "$repo" rev-parse -q --verify "refs/tags/$tag" \
          >/dev/null; then
          git -C "$repo" tag -a "$tag" -m "Release $tag"
          fi
          git -C "$repo" push origin "refs/tags/$tag"
          cd "$repo"
          gh release create "$tag" --verify-tag --generate-notes {{.CLI_ARGS}}

  # -- Misc

  delete-snapshots:
    aliases: [clean]
    desc: Safely delete a dated dotfile backup snapshot
    requires:
      vars: [DATE]
    cmds:
      - >-
          {{.SCRIPTS_DIR | shellQuote}}/delete-snapshot.sh --check
          {{.DOTFILES_SNAPSHOT_DIR | shellQuote}} {{.DATE | shellQuote}}
      - task: delete-snapshots:confirm
        vars:
          DATE: '{{.DATE}}'

  delete-snapshots:confirm:
    internal: true
    prompt: Delete dotfile snapshot {{.DATE}}?
    requires:
      vars: [DATE]
    cmds:
      - >-
          {{.SCRIPTS_DIR | shellQuote}}/delete-snapshot.sh
          {{.DOTFILES_SNAPSHOT_DIR | shellQuote}} {{.DATE | shellQuote}}

  brewfile:
    desc: Write installed Homebrew/MAS/VS Code packages into a Brewfile
    summary: |
      Write installed taps, formulae, casks, MAS apps, and VS Code extensions
      into a Brewfile while excluding non-Homebrew runtimes (go, uv, npm).

      If FILE is provided, overwrites an existing Brewfile. If FILE is not
      provided, writes the Brewfile to stdout.
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - |
          if ! command -v brew >/dev/null 2>&1; then
          echo "Homebrew (brew) is required to dump a Brewfile." >&2
          exit 1
          fi
          brew bundle dump --no-go --no-uv --no-npm \
          --file={{.FILE | default "-" | shellQuote}} --force

  installer:
    desc: Generate a chezmoi install-init-shell.sh script for a GitHub user
    requires:
      vars: [GITHUB_USERNAME]
    cmds:
      - >-
          chezmoi generate install-init-shell.sh
          {{.GITHUB_USERNAME | shellQuote}}

  stanford-krb5:
    desc: Download Stanford Kerberos config file atomically
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      URL: https://web.stanford.edu/dept/its/support/kerberos/dist/krb5.conf
      OUT: >-
        {{.FILE | default (joinPath .DEV_REPO_DIR
        "home/kerberos/stanford_krb5.conf")}}
    cmds:
      - |
          out={{.OUT | shellQuote}}
          out_dir="$(dirname -- "$out")"
          mkdir -p "$out_dir"
          tmp="$(mktemp "$out_dir/.krb5.XXXXXX")"
          trap 'rm -f -- "$tmp"' EXIT
          curl -fsSL -o "$tmp" {{.URL | shellQuote}}
          mv -f -- "$tmp" "$out"
          trap - EXIT
